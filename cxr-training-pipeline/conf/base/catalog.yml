# 01_raw files
cxr8_metadata:
  type: pandas.CSVDataset
  filepath: data/01_raw/Data_Entry_2017_v2020.csv

cxr8_bbox:
  type: pandas.CSVDataset
  filepath: data/01_raw/BBox_List_2017.csv

cxr8_train_val_list:
  type: text.TextDataset
  filepath: data/01_raw/train_val_list.txt

cxr8_test_list:
  type: text.TextDataset
  filepath: data/01_raw/test_list.txt

# 02_intermediate files - data splits
xray_train_val:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/dataset_splits/train_val.csv
  load_args:
    dtype_backend: "numpy_nullable"

xray_test:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/dataset_splits/test.csv
  load_args:
    dtype_backend: "numpy_nullable"

# 02_intermediate files - preprocessed data
train_val_images_npy:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: ${globals:precomputed_root}/${globals:resize}/train_images.npy

test_images_npy:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: ${globals:precomputed_root}/${globals:resize}/test_images.npy

# Labels
train_val_labels_npy:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: ${globals:precomputed_root}/${globals:resize}/train_labels.npy

test_labels_npy:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: ${globals:precomputed_root}/${globals:resize}/test_labels.npy

# model, valus for defaultthresholds, and threshold search results
best_checkpoint_path:
  type: text.TextDataset
  filepath: data/06_models/best_checkpoint_path.txt

val_pred_proba:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: data/08_reporting/val_pred_proba.npy

val_targets:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: data/08_reporting/val_targets.npy

best_thresholds:
  type: json.JSONDataset
  filepath: data/08_reporting/best_thresholds.json

threshold_search_results:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/threshold_search_results.parquet

# best model and test results
best_model:
  type: pickle.PickleDataset
  filepath: data/06_models/best_model.pkl

test_pred_proba:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: data/08_reporting/test_pred_proba.npy

test_targets:
  type: cxr_training_pipeline.extras.custom_kedro_dataset.numpy_memmap_dataset.NumpyMemmapDataset
  filepath: data/08_reporting/test_targets.npy

test_metrics_default:
  type: json.JSONDataset
  filepath: data/08_reporting/test_metrics_default.json

test_metrics_tuned:
  type: json.JSONDataset
  filepath: data/08_reporting/test_metrics_tuned.json

test_metrics_comparison:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/test_metrics_comparison.parquet

test_per_class_comparison:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/test_per_class_comparison.parquet