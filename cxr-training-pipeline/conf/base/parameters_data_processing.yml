data_processing:
  pathology_list:
    - "Infiltration"
    - "Effusion"
    - "Atelectasis"
    - "Nodule"
    - "Mass"
    - "Pneumothorax"
    - "Consolidation"
    - "Pleural_Thickening"
    - "Cardiomegaly"
    - "Emphysema"
    - "Edema"
    - "Fibrosis"
    - "Pneumonia"
    - "Hernia"

  columns_to_keep:
    - "image_index"
    - "finding_labels"
    - "patient_age"
    - "patient_sex"
    - "view_position"

  ohe_column: "finding_labels"


data_processing_transforms:
  resize: ${globals:resize}
  grayscale: true
  center_crop: 224
  normalize:
    mean: [0.5]
    std: [0.5]


data_processing_precompute:
  images_dir: data/01_raw/images
  train_val_output_path: ${globals:precomputed_root}/${globals:resize}/train_images.npy
  test_output_path: ${globals:precomputed_root}/${globals:resize}/test_images.npy
  image_size: ${globals:resize}
  image_col: "image_index"
